<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050714" />
    </radialGradient>

    <!-- Top Facet Gradient (Electric Cyan) -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Left Facet Gradient (Magenta / Pink Laser) -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="70%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>

    <!-- Right Facet Gradient (Cyber Violet) -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- 3D Cyber Shift Cube Group -->
  <g filter="url(#neonGlow)" transform="translate(0, 1)">
    <!-- Top Face (Isometric) -->
    <polygon points="32,10 50,21 32,32 14,21" fill="url(#topFacet)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />

    <!-- Left Face (Isometric) -->
    <polygon points="14,21 32,32 32,53 14,42" fill="url(#leftFacet)" stroke="#ff2a85" stroke-width="0.8" stroke-opacity="0.8" />

    <!-- Right Face (Isometric) -->
    <polygon points="32,32 50,21 50,42 32,53" fill="url(#rightFacet)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.8" />

    <!-- Shifting Puzzle Seams & Circuit Nodes -->
    <!-- Top Face Seam -->
    <line x1="23" y1="15.5" x2="41" y2="26.5" stroke="#082f49" stroke-width="1.2" stroke-dasharray="2,2" />
    <circle cx="32" cy="21" r="1.8" fill="#38bdf8" filter="drop-shadow(0 0 3px #38bdf8)" />

    <!-- Left Face Puzzle Notch -->
    <path d="M 23,26.5 L 23,37.5 M 14,31.5 L 23,37 L 32,32" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.6" fill="none" />

    <!-- Right Face Puzzle Notch -->
    <path d="M 41,26.5 L 41,37.5 M 32,42.5 L 41,37 L 50,31.5" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.7" fill="none" />

    <!-- Center Laser Convergence Spark -->
    <circle cx="32" cy="32" r="2.2" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />
  </g>
</svg>
